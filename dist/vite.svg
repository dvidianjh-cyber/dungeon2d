<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M64 8 L108 24 V64 C108 92 88 114 64 122 C40 114 20 92 20 64 V24 Z" 
        fill="url(#darkGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        filter="url(#glow)"/>
        
  <!-- Inner Dungeon Emblem / Crossed Swords -->
  <path d="M64 28 L72 44 H88 L74 56 L80 72 L64 60 L48 72 L54 56 L40 44 H56 Z" 
        fill="#38bdf8" 
        opacity="0.9"/>
        
  <!-- 2D Brick Accent -->
  <rect x="46" y="80" width="16" height="8" rx="2" fill="#0284c7" opacity="0.8"/>
  <rect x="66" y="80" width="16" height="8" rx="2" fill="#0284c7" opacity="0.8"/>
  <rect x="56" y="92" width="16" height="8" rx="2" fill="#38bdf8" opacity="0.7"/>
</svg>
